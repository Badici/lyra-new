name: CI

on:
  push:
    branches: [main, full-remake, total-revamp]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/lyra?sslmode=require
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
